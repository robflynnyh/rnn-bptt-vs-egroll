[project]
name = "rnn-bptt-vs-eggroll"
version = "0.1.0"
description = "Controlled BPTT versus EGGROLL experiments on associative recall."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
rnn-memory-compare = "rnn_bptt_vs_eggroll.experiment:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
